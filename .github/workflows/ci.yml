name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            collector/requirements.txt
            ml/requirements.txt

      - name: Install dependencies (pinned, scikit-learn 1.5.2)
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r collector/requirements.txt -r ml/requirements.txt
          pip install pytest==9.1.1 hypothesis==6.168.3 httpx==0.27.0 ruff==0.16.9

      - name: Ruff
        run: ruff check .

      # Nenhum destes testes abre conexao com banco ou VM: a API usa um DATABASE_URL
      # dummy (engine lazy e mocks) e o backfill exige a variavel definida ao importar.
      - name: pytest (api)
        working-directory: api
        env:
          DATABASE_URL: postgresql://test:test@localhost/test
        run: python -m pytest tests -q

      - name: pytest (ml)
        working-directory: ml
        env:
          DATABASE_URL: postgresql://test:test@localhost/test
        run: python -m pytest tests -q

      - name: pytest (collector)
        working-directory: collector
        env:
          DATABASE_URL: postgresql://test:test@localhost/test
        run: python -m pytest tests -q

      - name: pytest (scripts)
        working-directory: scripts
        env:
          DATABASE_URL: postgresql://test:test@localhost/test
        run: python -m pytest tests -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm test
